# Revisa cada cambio y, si todo pasa, instala reglas y tareas del servidor en Firebase:
#   rama main       → proyecto de pruebas (lps911-pruebas)
#   rama produccion → proyecto real de la obra
# La página la publica Netlify por su cuenta (ver netlify.toml).
name: Revisar y publicar

on:
  push:
    branches: [main, produccion]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lps911-${{ github.ref }}
  cancel-in-progress: false

jobs:
  revisar:
    name: Revisar (sintaxis, tareas del servidor, reglas)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Sintaxis de la página
        run: node scripts/check.mjs
      - name: Pruebas de las tareas del servidor
        working-directory: functions
        run: npm install --no-audit --no-fund && npm test
      - name: Pruebas de las reglas de seguridad (emulador)
        run: |
          npm install -g firebase-tools@13 --no-audit --no-fund
          (cd tests/rules && npm install --no-audit --no-fund)
          firebase emulators:exec --only firestore --project demo-lps "cd tests/rules && npm test"

  instalar:
    name: Instalar en Firebase
    needs: revisar
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'produccion')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'produccion' && 'produccion' || 'pruebas' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ github.ref_name == 'produccion' && secrets.FIREBASE_SA_PRODUCCION || secrets.FIREBASE_SA_PRUEBAS }}
      - name: Instalar reglas y tareas del servidor
        run: |
          npm install -g firebase-tools@13 --no-audit --no-fund
          (cd functions && npm install --no-audit --no-fund --omit=dev)
          TARGET=${{ github.ref_name == 'produccion' && 'produccion' || 'pruebas' }}
          ONLY="firestore:rules,firestore:indexes,functions"
          if [ "$TARGET" = "produccion" ]; then ONLY="$ONLY,database"; fi
          firebase deploy --only "$ONLY" --project "$TARGET" --non-interactive --force
